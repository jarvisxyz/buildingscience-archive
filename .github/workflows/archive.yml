name: Monthly Archive Scrape

on:
  schedule:
    - cron: '0 2 1 * *'   # 02:00 UTC on the 1st of every month
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write          # needed to push commits

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt 2>/dev/null || true
          pip install --quiet requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scripts/scrape_buildingscience.py

      - name: Rebuild browser index
        run: python scripts/build_browser.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: monthly archive update $(date +%Y-%m-%d)"
            git push
          fi
