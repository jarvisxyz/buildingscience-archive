<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Science Archive</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<style>
/* ── Reset & Variables ── */
*, *::before, *::after {{ box-sizing: border-box; margin: 0; padding: 0; }}

:root {{
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius: 8px;
  --transition: 0.2s ease;
}}

[data-theme="dark"] {{
  --bg-primary: #0f1117;
  --bg-secondary: #161922;
  --bg-tertiary: #1e2230;
  --bg-hover: #252a3a;
  --bg-card: #1a1e2c;
  --border: #2a2f40;
  --text-primary: #e4e7ef;
  --text-secondary: #9498a8;
  --text-muted: #636778;
  --accent: #6c8cff;
  --accent-hover: #8da6ff;
  --accent-dim: rgba(108,140,255,0.12);
  --tag-bg: rgba(108,140,255,0.12);
  --tag-text: #8da6ff;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --search-bg: #1a1e2c;
}}

[data-theme="light"] {{
  --bg-primary: #f7f8fb;
  --bg-secondary: #ffffff;
  --bg-tertiary: #eef0f5;
  --bg-hover: #e8eaf0;
  --bg-card: #ffffff;
  --border: #d8dbe5;
  --text-primary: #1a1e2c;
  --text-secondary: #5a5f72;
  --text-muted: #8a8fa2;
  --accent: #4466e0;
  --accent-hover: #3355cc;
  --accent-dim: rgba(68,102,224,0.08);
  --tag-bg: rgba(68,102,224,0.08);
  --tag-text: #4466e0;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --search-bg: #eef0f5;
}}

html {{ font-size: 15px; }}
body {{
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}}

a {{ color: var(--accent); text-decoration: none; }}
a:hover {{ color: var(--accent-hover); }}

/* ── Layout ── */
.app {{ display: flex; min-height: 100vh; }}

.sidebar {{
  width: 280px;
  min-width: 280px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform 0.3s ease, background var(--transition);
}}

.main {{
  flex: 1;
  margin-left: 280px;
  padding: 2rem 2.5rem;
  max-width: 100%;
  transition: margin var(--transition);
}}

/* ── Sidebar Header ── */
.sidebar-header {{
  padding: 1.25rem 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}}

.sidebar-header h1 {{
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}}

.sidebar-header h1 .icon {{
  width: 22px;
  height: 22px;
  background: var(--accent);
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #fff;
}}

/* ── Search ── */
.search-wrap {{
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
}}

.search-input {{
  width: 100%;
  padding: 0.55rem 0.75rem 0.55rem 2.2rem;
  background: var(--search-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 0.85rem;
  outline: none;
  transition: border var(--transition), background var(--transition);
}}

.search-input:focus {{ border-color: var(--accent); }}

.search-wrap {{
  position: relative;
}}

.search-wrap::before {{
  content: "⌕";
  position: absolute;
  left: 1.75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.9rem;
  pointer-events: none;
}}

/* ── Sidebar Sections ── */
.sidebar-section {{
  padding: 1rem 1.25rem 0.5rem;
}}

.sidebar-section h3 {{
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}}

.category-list, .tag-list {{ list-style: none; }}

.category-list li, .tag-list li {{
  padding: 0.3rem 0.6rem;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--text-secondary);
  transition: background var(--transition), color var(--transition);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}}

.category-list li:hover, .tag-list li:hover {{
  background: var(--bg-hover);
  color: var(--text-primary);
}}

.category-list li.active, .tag-list li.active {{
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 500;
}}

.category-list li .count {{
  margin-left: auto;
  font-size: 0.72rem;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  padding: 0.05rem 0.45rem;
  border-radius: 10px;
}}

.tag-list li {{ display: inline-flex; margin: 0 0.25rem 0.3rem 0; }}

/* ── Sidebar Footer ── */
.sidebar-footer {{
  margin-top: auto;
  padding: 0.75rem 1.25rem;
  border-top: 1px solid var(--border);
}}

.theme-toggle {{
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--text-secondary);
  background: none;
  border: none;
  width: 100%;
  padding: 0.4rem 0;
  transition: color var(--transition);
}}

.theme-toggle:hover {{ color: var(--text-primary); }}

.theme-toggle .toggle-track {{
  width: 36px;
  height: 20px;
  background: var(--bg-tertiary);
  border-radius: 10px;
  position: relative;
  transition: background var(--transition);
}}

.theme-toggle .toggle-thumb {{
  width: 16px;
  height: 16px;
  background: var(--accent);
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform var(--transition);
}}

[data-theme="light"] .toggle-thumb {{ transform: translateX(16px); }}

/* ── Main Content ── */
.main-header {{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}}

.main-header h2 {{
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}}

.main-header .result-count {{
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 0.5rem;
}}

.sort-controls {{
  display: flex;
  gap: 0.25rem;
  background: var(--bg-secondary);
  border-radius: var(--radius);
  padding: 3px;
  border: 1px solid var(--border);
}}

.sort-btn {{
  padding: 0.3rem 0.7rem;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.78rem;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
}}

.sort-btn.active {{
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 500;
}}

/* ── Cards ── */
.card-grid {{
  display: grid;
  gap: 0.75rem;
}}

.card {{
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.25rem;
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
  cursor: default;
}}

.card:hover {{
  border-color: var(--accent);
  box-shadow: var(--shadow);
}}

.card-header {{
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 0.4rem;
}}

.card-category {{
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  white-space: nowrap;
  margin-top: 2px;
}}

.card-title {{
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.35;
  flex: 1;
}}

.card-content {{
  font-size: 0.84rem;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 0.65rem;
}}

.card-meta {{
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}}

.card-date {{
  font-size: 0.75rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}}

.card-tags {{
  display: flex;
  gap: 0.3rem;
  flex-wrap: wrap;
}}

.card-tag {{
  font-size: 0.7rem;
  padding: 0.1rem 0.45rem;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--tag-text);
  cursor: pointer;
  transition: opacity var(--transition);
}}

.card-tag:hover {{ opacity: 0.8; }}

.card-author {{
  font-size: 0.75rem;
  color: var(--text-muted);
}}

/* ── Empty State ── */
.empty-state {{
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}}

.empty-state .icon {{ font-size: 2.5rem; margin-bottom: 1rem; }}
.empty-state p {{ font-size: 0.9rem; }}

/* ── Mobile hamburger ── */
.mobile-header {{
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  z-index: 90;
  align-items: center;
  padding: 0 1rem;
  gap: 0.75rem;
}}

.hamburger {{
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 1.4rem;
  cursor: pointer;
  padding: 0.3rem;
}}

.sidebar-overlay {{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}}

/* ── Responsive ── */
@media (max-width: 768px) {{
  .mobile-header {{ display: flex; }}
  .sidebar {{ transform: translateX(-100%); }}
  .sidebar.open {{ transform: translateX(0); }}
  .sidebar-overlay.open {{ display: block; }}
  .main {{ margin-left: 0; padding: 4.5rem 1rem 1.5rem; }}
}}

/* ── Highlight search matches ── */
mark {{
  background: var(--accent-dim);
  color: var(--accent);
  padding: 0 2px;
  border-radius: 2px;
}}
</style>
</head>
<body>

<!-- Mobile header -->
<div class="mobile-header">
  <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">☰</button>
  <span style="font-weight:600;font-size:0.95rem;">Building Science Archive</span>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="icon">B</span> Building Science Archive</h1>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="Search titles & content…" autocomplete="off">
    </div>

    <div class="sidebar-section">
      <h3>Categories</h3>
      <ul class="category-list" id="categoryList"></ul>
    </div>

    <div class="sidebar-section">
      <h3>Tags</h3>
      <div class="tag-list" id="tagList"></div>
    </div>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle">
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span id="themeLabel">Dark mode</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div class="main-header">
      <h2 id="mainTitle">All Items <span class="result-count" id="resultCount"></span></h2>
      <div class="sort-controls">
        <button class="sort-btn active" data-sort="date">Date ↓</button>
        <button class="sort-btn" data-sort="title">Title A–Z</button>
      </div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </main>
</div>

<script>
// ── State ──
let allItems = [];
let fuse = null;
let activeCategory = null;
let activeTag = null;
let currentSort = "date";
let searchQuery = "";

// ── Theme ──
function initTheme() {{
  const saved = localStorage.getItem("bsa-theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  updateThemeLabel(saved);
}}

function toggleTheme() {{
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("bsa-theme", next);
  updateThemeLabel(next);
}}

function updateThemeLabel(theme) {{
  document.getElementById("themeLabel").textContent = theme === "dark" ? "Dark mode" : "Light mode";
}}

document.getElementById("themeToggle").addEventListener("click", toggleTheme);
initTheme();

// ── Mobile sidebar ──
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebarOverlay");

document.getElementById("hamburgerBtn").addEventListener("click", () => {{
  sidebar.classList.toggle("open");
  overlay.classList.toggle("open");
}});

overlay.addEventListener("click", () => {{
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
}});

// ── Load data ──
async function loadData() {{
  try {{
    const res = await fetch("index.json");
    if (!res.ok) throw new Error("Failed to load index.json");
    allItems = await res.json();
  }} catch (e) {{
    console.warn("Could not load index.json, using embedded placeholder data.", e);
    allItems = PLACEHOLDER_DATA;
  }}
  initFuse();
  buildSidebar();
  render();
}}

// ── Fuse.js ──
function initFuse() {{
  fuse = new Fuse(allItems, {{
    keys: [
      {{ name: "title", weight: 2 }},
      {{ name: "content", weight: 1 }},
    ],
    threshold: 0.35,
    includeMatches: true,
    minMatchCharLength: 2,
  }});
}}

// ── Build sidebar ──
function buildSidebar() {{
  // Categories
  const cats = {{}};
  allItems.forEach(item => {{
    const c = item.category || "uncategorized";
    cats[c] = (cats[c] || 0) + 1;
  }});

  const catList = document.getElementById("categoryList");
  catList.innerHTML = `<li class="active" data-cat="">All <span class="count">${{allItems.length}}</span></li>`;
  Object.keys(cats).sort().forEach(cat => {{
    catList.innerHTML += `<li data-cat="${{cat}}">${{capitalize(cat)}} <span class="count">${{cats[cat]}}</span></li>`;
  }});

  catList.querySelectorAll("li").forEach(li => {{
    li.addEventListener("click", () => {{
      activeCategory = li.dataset.cat || null;
      catList.querySelectorAll("li").forEach(l => l.classList.remove("active"));
      li.classList.add("active");
      render();
      closeMobileSidebar();
    }});
  }});

  // Tags
  const tags = new Set();
  allItems.forEach(item => (item.tags || []).forEach(t => tags.add(t)));

  const tagList = document.getElementById("tagList");
  tagList.innerHTML = "";
  Array.from(tags).sort().forEach(tag => {{
    const li = document.createElement("li");
    li.textContent = tag;
    li.dataset.tag = tag;
    li.addEventListener("click", () => {{
      if (activeTag === tag) {{
        activeTag = null;
        li.classList.remove("active");
      }} else {{
        tagList.querySelectorAll("li").forEach(l => l.classList.remove("active"));
        activeTag = tag;
        li.classList.add("active");
      }}
      render();
      closeMobileSidebar();
    }});
    tagList.appendChild(li);
  }});
}}

function closeMobileSidebar() {{
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
}}

// ── Search ──
document.getElementById("searchInput").addEventListener("input", (e) => {{
  searchQuery = e.target.value.trim();
  render();
}});

// ── Sort ──
document.querySelectorAll(".sort-btn").forEach(btn => {{
  btn.addEventListener("click", () => {{
    currentSort = btn.dataset.sort;
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  }});
}});

// ── Render ──
function render() {{
  let items = searchQuery ? fuse.search(searchQuery).map(r => r.item) : [...allItems];

  // Filter by category
  if (activeCategory) {{
    items = items.filter(i => i.category === activeCategory);
  }}

  // Filter by tag
  if (activeTag) {{
    items = items.filter(i => (i.tags || []).includes(activeTag));
  }}

  // Sort
  if (currentSort === "date") {{
    items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }} else {{
    items.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  }}

  // Update title
  const titleEl = document.getElementById("mainTitle");
  const catLabel = activeCategory ? capitalize(activeCategory) : "All Items";
  const countEl = document.getElementById("resultCount");
  countEl.textContent = `(${{items.length}})`;
  titleEl.innerHTML = `${{catLabel}} <span class="result-count">${{items.length}}</span>`;

  // Render cards
  const grid = document.getElementById("cardGrid");
  if (items.length === 0) {{
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No items match your search or filters.</p></div>`;
    return;
  }}

  grid.innerHTML = items.map(item => {{
    const tags = (item.tags || []).map(t =>
      `<span class="card-tag" data-tag="${{t}}">${{t}}</span>`
    ).join("");

    return `
      <div class="card">
        <div class="card-header">
          <span class="card-category">${{item.category || "general"}}</span>
          <div class="card-title">${{highlight(item.title)}}</div>
        </div>
        <div class="card-content">${{highlight(item.content)}}</div>
        <div class="card-meta">
          ${{item.date ? `<span class="card-date">${{item.date}}</span>` : ""}}
          ${{item.author ? `<span class="card-author">by ${{item.author}}</span>` : ""}}
          ${{tags ? `<div class="card-tags">${{tags}}</div>` : ""}}
        </div>
      </div>
    `;
  }}).join("");

  // Wire card tags
  grid.querySelectorAll(".card-tag").forEach(el => {{
    el.addEventListener("click", () => {{
      const tag = el.dataset.tag;
      if (activeTag === tag) {{
        activeTag = null;
        document.querySelectorAll("#tagList li").forEach(l => l.classList.remove("active"));
      }} else {{
        activeTag = tag;
        document.querySelectorAll("#tagList li").forEach(l => {{
          l.classList.toggle("active", l.dataset.tag === tag);
        }});
      }}
      render();
    }});
  }});
}}

function highlight(text) {{
  if (!searchQuery || !text) return escapeHtml(text || "");
  // Simple highlight — wrap matched substrings
  const escaped = escapeHtml(text);
  const query = escapeHtml(searchQuery);
  const regex = new RegExp(`(${{query.replace(/[.*+?^${{}}()|[\]\\]/g, "\\$&")}})`, "gi");
  return escaped.replace(regex, "<mark>$1</mark>");
}}

function escapeHtml(str) {{
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}}

function capitalize(s) {{
  return s.charAt(0).toUpperCase() + s.slice(1);
}}

// ── Embedded placeholder data (fallback) ──
const PLACEHOLDER_DATA = [

  {

    "tags": [
      "energy",

    ],
    "date": "2025-03-22",
    "author": ""
  },
  {
    "id": "event-001",
    "category": "events",
    "title": "Building Science Symposium 2025",
    "content": "Annual symposium featuring presentations on deep energy retrofits, enclosure durability, and indoor air quality in high-performance homes.",
    "tags": [

  {

    "content": "IECC climate zone map with county-level resolution, supporting lookup by ZIP code for quick determination of prescriptive requirements.",
    "tags": [
